apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: refusjon
  namespace: helsearbeidsgiver
  labels:
    team: helsearbeidsgiver
  annotations:
    dcat.data.nav.no/title: "Refusjon"
    dcat.data.nav.no/description: "Refusjon av sykepenger til arbeidsgivere"
    dcat.data.nav.no/keyword: "sykepenger, refusjon"
    dcat.data.nav.no/theme: "sykepenger"

spec:
  pool: nav-dev
  config:  # optional; all fields are optional too; defaults shown
    minimumInSyncReplicas: 1
    partitions: 3
    replication: 2  # see min/max requirements
    retentionBytes: -1  # -1 means unlimited
    retentionHours: 1  # -1 means unlimited
  acl:
    - team: helsearbeidsgiver
      application: refusjon
      access: readwrite
    - team: helsearbeidsgiver
      application: sykepenger-im-lps-api
      access: readwrite
